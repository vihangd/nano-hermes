[project]
name = "nano-hermes"
version = "0.8.0"
description = "Self-evolving memory and skill extensions for HKUDS nanobot"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "aiohttp>=3.10",
  "numpy>=1.26,<3",
  "sqlite-vec>=0.1.6",
  "tiktoken>=0.6",
]

# ``nanobot`` itself is a peer dependency: users install it themselves
# (and can pin any version) — importing it at runtime is enough.
[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4",
  "ruff>=0.4",
  # 0.2.0 ships nanobot.session.goal_state and a larger built-in skill
  # catalog (long-goal, weather, tmux, github, summarize, etc.) that
  # nano-hermes' coordinator/goal.py keys on. See README for upgrade notes.
  "nanobot-ai>=0.2.2",
]

# Wrapper CLI. Delegates to nanobot's Typer app after monkey-patching
# AgentLoop.__init__ to auto-install us — see nano_hermes/cli.py.
[project.scripts]
nano-hermes = "nano_hermes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
